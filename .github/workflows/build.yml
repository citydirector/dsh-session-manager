name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档不打包（tag 推送不受 paths 过滤，发布照常）
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
# 同一分支/标签上的新推送取消尚未跑完的旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: 单元测试
        run: node --test test/manager.spec.mjs test/discover.spec.mjs
      - name: 打包 dsm.exe
        run: node scripts/build-exe.mjs
      - name: 冒烟测试（真实 Windows 进程检测）
        run: node scripts/smoke-exe.mjs dist/dsm.exe
      - name: 压缩
        shell: pwsh
        run: Compress-Archive -Path dist/dsm.exe, README.md, README.zh-CN.md, LICENSE -DestinationPath dist/dsm-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dsm-win-x64
          path: dist/dsm-win-x64.zip
      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsm-win-x64.zip
